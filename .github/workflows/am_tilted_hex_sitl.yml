name: AM Tilted-Hex SITL

on:
  pull_request:
    branches:
      - release/1.18
  push:
    branches:
      - release/1.18
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PX4_SBOM_DISABLE: 1
  PYTHONUNBUFFERED: 1

jobs:
  fmuv4-firmware:
    name: FMUv4 firmware fit and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out PX4 and pinned submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/setup/requirements.txt

      - name: Install PX4 NuttX dependencies
        run: ./Tools/setup/ubuntu.sh --no-sim-tools

      - name: Verify pinned ARM compiler
        run: test "$(arm-none-eabi-gcc -dumpfullversion)" = "13.2.1"

      - name: Restore compiler cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: am-fmuv4
          max-size: 400M

      - name: Build upstream FMUv4 baseline
        run: make px4_fmu-v4_default

      - name: Build AM FMUv4 firmware
        run: make px4_fmu-v4_am_tilted_hex

      - name: Audit image, airframe, modules, stacks, and serial budget
        run: >-
          python3 Tools/ci/am_fmuv4/audit.py
          --build-dir build/px4_fmu-v4_am_tilted_hex
          --baseline-build-dir build/px4_fmu-v4_default
          --report build/px4_fmu-v4_am_tilted_hex/fw01-audit.json

      - name: Audit FW-02 bench package and immutable companion pins
        run: python3 Tools/bench/am_fmuv4/fw02_audit.py --ci

      - name: Record this CI build's embedded source identity and hashes
        run: |
          git rev-parse HEAD > build/px4_fmu-v4_am_tilted_hex/ci-source-commit.txt
          sha256sum \
            build/px4_fmu-v4_am_tilted_hex/px4_fmu-v4_am_tilted_hex.px4 \
            build/px4_fmu-v4_am_tilted_hex/px4_fmu-v4_am_tilted_hex.bin \
            > build/px4_fmu-v4_am_tilted_hex/ci-SHA256SUMS

      - name: Upload firmware evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: am-fmuv4-${{ github.run_id }}
          path: |
            build/px4_fmu-v4_am_tilted_hex/fw01-audit.json
            build/px4_fmu-v4_am_tilted_hex/ci-source-commit.txt
            build/px4_fmu-v4_am_tilted_hex/ci-SHA256SUMS
            build/px4_fmu-v4_am_tilted_hex/px4_fmu-v4_am_tilted_hex.px4
            Tools/bench/am_fmuv4/artifacts/build-manifest.json
            Tools/bench/am_fmuv4/artifacts/SHA256SUMS
            Tools/bench/am_fmuv4/params/am_fmuv4_lab02a.params
            Tools/bench/am_fmuv4/params/migration-inventory.tsv
            build/px4_fmu-v4_am_tilted_hex/px4_fmu-v4_am_tilted_hex.map
            build/px4_fmu-v4_am_tilted_hex/boardconfig
            build/px4_fmu-v4_default/px4_fmu-v4_default.map
            build/px4_fmu-v4_default/boardconfig
          if-no-files-found: warn
          retention-days: 14

      - name: Save compiler cache
        if: always()
        uses: ./.github/actions/save-ccache
        with:
          cache-primary-key: ${{ steps.ccache.outputs.cache-primary-key }}

  fw02-companion-image:
    name: FW-02 pinned Jazzy shadow image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out PX4
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build pinned Agent and px4_msgs image
        working-directory: Tools/bench/am_fmuv4/agent
        run: docker compose --env-file pins.env -f compose.yaml build

      - name: Verify image pins, tools, and observed message definitions
        working-directory: Tools/bench/am_fmuv4/agent
        run: ./verify-image.sh

      - name: Prove the observer fails closed without FC topics
        working-directory: Tools/bench/am_fmuv4/agent
        run: |
          mkdir -p evidence
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)
          set +e
          docker compose --env-file pins.env -f compose.yaml run --rm --no-deps \
            shadow-observer python3 /opt/am_fw02/shadow_monitor.py \
            --duration 0.5 --output /evidence/no-fc.json
          status=$?
          set -e
          test "$status" -eq 2
          python3 -c 'import json; report=json.load(open("evidence/no-fc.json")); assert report["pass"] is False and report["missing_required_topics"]'

      - name: Tear down isolated shadow network
        if: always()
        working-directory: Tools/bench/am_fmuv4/agent
        run: docker compose --env-file pins.env -f compose.yaml down

  lifecycle-and-safe-faults:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - simulator: sih
            label: SIH lifecycle and SAFE faults
            setup_flags: --no-nuttx --no-sim-tools
          - simulator: gazebo
            label: Gazebo lifecycle and SAFE faults
            setup_flags: --no-nuttx

    steps:
      - name: Check out PX4 and pinned submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/setup/requirements.txt

      - name: Install PX4 host dependencies
        run: ./Tools/setup/ubuntu.sh ${{ matrix.setup_flags }}

      - name: Restore compiler cache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: am-tilted-hex-${{ matrix.simulator }}
          max-size: 400M

      - name: Test lifecycle helpers
        run: python3 Tools/simulation/am_tilted_hex/test_run_lifecycle.py -v

      - name: Run ${{ matrix.label }}
        run: >-
          python3 Tools/simulation/am_tilted_hex/run_lifecycle.py
          --simulator ${{ matrix.simulator }}
          --scenario all

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: am-tilted-hex-${{ matrix.simulator }}-${{ github.run_id }}
          path: |
            build/am_tilted_hex_lifecycle/**/summary.json
            build/am_tilted_hex_lifecycle/**/build.log
            build/am_tilted_hex_lifecycle/**/px4.log
            build/am_tilted_hex_lifecycle/**/rootfs/log/**/*.ulg
          if-no-files-found: warn
          retention-days: 14

      - name: Save compiler cache
        if: always()
        uses: ./.github/actions/save-ccache
        with:
          cache-primary-key: ${{ steps.ccache.outputs.cache-primary-key }}
